
name: Deploy Turismo-Colon

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Actualizar codigo desde GitHub
        run: |
          cd /home/turismocolon/Turismo-colon
          git pull origin main

      - name: Instalar dependencias
        run: |
          cd /home/turismocolon/Turismo-colon/colon-turismo-mvp
          npm install

      - name: Reiniciar aplicacion
        run: |
          pm2 restart turismo-colon

      - name: Verificar servidor
        run: |
          curl -f http://localhost:3000
